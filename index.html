<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多平台比价本 💰</title>
<style>
  :root {
    --brand: #e94b35;
    --brand-light: #fdeeea;
    --text: #1f2733;
    --muted: #7a8698;
    --bg: #f5f7fa;
    --card: #fff;
    --green: #10a37f;
    --line: #ebeff5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 18px 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 24px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .summary { display: flex; gap: 10px; margin-bottom: 16px; }
  .sm { flex: 1; background: var(--card); border-radius: 14px; padding: 14px 12px; text-align: center; box-shadow: 0 1px 6px rgba(31,39,51,.06); }
  .sm b { display: block; font-size: 22px; color: var(--brand); }
  .sm span { font-size: 12px; color: var(--muted); }

  .group { background: var(--card); border-radius: 16px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(31,39,51,.06); overflow: hidden; }
  .group-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .group-head .name { font-size: 17px; font-weight: 700; }
  .group-head .save { font-size: 13px; color: var(--green); font-weight: 600; }

  .item { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
  .item:last-child { border-bottom: none; }
  .item.best { background: linear-gradient(90deg, #f0fbf7, #fff); }
  .plat { font-size: 13px; padding: 4px 9px; border-radius: 8px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .item.best .plat { background: var(--green); color: #fff; }
  .price { font-size: 20px; font-weight: 700; margin-left: auto; }
  .item.best .price { color: var(--green); }
  .delta { font-size: 12px; color: var(--muted); width: 56px; text-align: right; }
  .delta.up { color: var(--brand); }
  .delta.down { color: var(--green); }
  .ops { display: flex; gap: 4px; margin-left: 6px; }
  .ops button { border: none; background: none; font-size: 16px; cursor: pointer; padding: 4px; opacity: .55; }
  .ops button:active { opacity: 1; }
  .badge-low { font-size: 11px; color: #fff; background: var(--green); padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .target-line { font-size: 12px; color: var(--muted); padding: 8px 16px 12px; background: #fcfdff; }
  .target-line.hit { color: var(--brand); font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 15px; line-height: 1.9; }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px;
    background: var(--brand); color: #fff; border: none;
    font-size: 18px; font-weight: 700; padding: 16px 34px; border-radius: 30px;
    box-shadow: 0 6px 18px rgba(233,75,53,.4); cursor: pointer; z-index: 50;
  }
  .fab:active { transform: translateX(-50%) scale(.96); }

  /* 弹层 */
  .mask { position: fixed; inset: 0; background: rgba(20,30,45,.55); display: none; align-items: flex-end; z-index: 100; }
  .mask.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 20px 18px 26px; max-height: 88vh; overflow-y: auto; }
  .sheet h2 { font-size: 19px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; font-size: 17px; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px;
    background: #fcfdff; color: var(--text); font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brand); background: #fff; }
  .row2 { display: flex; gap: 10px; }
  .row2 > .field { flex: 1; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; padding: 15px 0; cursor: pointer; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: var(--bg); color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(16px); background: var(--text); color: #fff; font-size: 15px; padding: 11px 20px; border-radius: 22px; opacity: 0; pointer-events: none; transition: .3s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tools { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
  .tools button { border: none; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .modal-info { font-size: 15px; line-height: 1.9; color: var(--text); margin-bottom: 18px; white-space: pre-line; }

  .ocr-box { border: 2px dashed #d8e0ea; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; background: #fbfcfe; }
  .ocr-box:active { background: #f2f6fb; }
  .ocr-box .icon { font-size: 30px; }
  .ocr-box .t1 { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .ocr-box .t2 { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  .ocr-status { font-size: 13px; color: var(--brand); margin-top: 8px; min-height: 18px; line-height: 1.6; }
  .ocr-preview { display: none; margin-top: 10px; border-radius: 12px; max-height: 180px; width: 100%; object-fit: contain; background: #f3f6fa; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 多平台比价本</h1>
  </header>
  <div class="sub">同一件商品，各平台价格一目了然</div>

  <div class="summary">
    <div class="sm"><b id="sGroups">0</b><span>在比商品</span></div>
    <div class="sm"><b id="sSave">¥0</b><span>最多可省</span></div>
    <div class="sm"><b id="sHits">0</b><span>达到目标价</span></div>
  </div>

  <div id="list"></div>

  <div class="tools">
    <button onclick="openAdd()">＋ 添加商品</button>
    <button onclick="exportData()">导出备份</button>
    <button onclick="document.getElementById('importFile').click()">导入备份</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</div>

<button class="fab" onclick="openAdd()">＋ 添加比价</button>

<!-- 添加/编辑弹层 -->
<div class="mask" id="addMask">
  <div class="sheet">
    <h2 id="sheetTitle">添加商品</h2>
    <div class="field">
      <div class="ocr-box" onclick="document.getElementById('ocrFile').click()">
        <div class="icon">📷</div>
        <div class="t1">拍照 / 上传商品截图，自动识别</div>
        <div class="t2">自动读取商品名称、价格和平台<br>识别后请核对一下再保存</div>
      </div>
      <input type="file" id="ocrFile" accept="image/*" onchange="doOCR(this)" style="display:none">
      <img id="ocrPreview" class="ocr-preview" alt="预览">
      <div class="ocr-status" id="ocrStatus"></div>
    </div>
    <div class="field">
      <label>商品名称（同一商品请填完全相同的名称，才能自动对比）</label>
      <input id="fName" list="nameList" placeholder="例如：小米移动电源3 10000mAh">
      <datalist id="nameList"></datalist>
    </div>
    <div class="row2">
      <div class="field">
        <label>平台</label>
        <select id="fPlat">
          <option>淘宝</option><option>天猫</option><option>京东</option>
          <option>拼多多</option><option>抖音</option><option>唯品会</option>
          <option>苏宁</option><option>线下店</option><option>其他</option>
        </select>
      </div>
      <div class="field">
        <label>当前价格（元）</label>
        <input id="fPrice" type="number" inputmode="decimal" step="0.01" placeholder="99.00">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>目标价（元，可选）</label>
        <input id="fTarget" type="number" inputmode="decimal" step="0.01" placeholder="降到这个价提醒我">
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <input id="fNote" placeholder="规格/店铺等">
      </div>
    </div>
    <div class="field">
      <label>商品链接（可选）</label>
      <input id="fLink" placeholder="https://…">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeAdd()">取消</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- 提醒弹窗 -->
<div class="mask" id="alertMask">
  <div class="sheet">
    <h2>🎉 有商品降到你想要的价格了</h2>
    <div class="modal-info" id="alertInfo"></div>
    <div class="sheet-actions">
      <button class="btn btn-primary" onclick="closeAlert()">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = "price_compare_v1";
let items = JSON.parse(localStorage.getItem(KEY) || "[]");
let editingId = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
function today() { return new Date().toISOString().slice(0, 10); }

function groups() {
  const map = {};
  items.forEach(it => {
    const k = it.name.trim();
    (map[k] = map[k] || []).push(it);
  });
  return map;
}

function render() {
  const g = groups();
  const keys = Object.keys(g);
  const list = document.getElementById("list");

  // 汇总
  let maxSave = 0, hits = 0;
  keys.forEach(k => {
    const arr = g[k].slice().sort((a, b) => a.price - b.price);
    if (arr.length > 1) maxSave += arr[arr.length - 1].price - arr[0].price;
    arr.forEach(it => { if (it.target && it.price <= it.target) hits++; });
  });
  document.getElementById("sGroups").textContent = keys.length;
  document.getElementById("sSave").textContent = "¥" + Math.round(maxSave);
  document.getElementById("sHits").textContent = hits;

  if (keys.length === 0) {
    list.innerHTML = '<div class="empty">还没有商品<br>点击下方「＋ 添加比价」开始<br><span style="font-size:13px">同一商品在不同平台各添加一次，就会自动对比出最低价</span></div>';
    return;
  }

  list.innerHTML = "";
  keys.sort().forEach(k => {
    const arr = g[k].slice().sort((a, b) => a.price - b.price);
    const low = arr[0].price, high = arr[arr.length - 1].price;
    const diff = high - low;
    const box = document.createElement("div");
    box.className = "group";
    box.innerHTML = '<div class="group-head"><div class="name">' + esc(k) + '</div>' +
      (arr.length > 1 && diff > 0 ? '<div class="save">最低价比最高省 ¥' + diff.toFixed(2) + '</div>' : '') + '</div>';

    arr.forEach((it, idx) => {
      const hist = it.history || [];
      let deltaHtml = '<div class="delta"></div>';
      if (hist.length > 1) {
        const prev = hist[hist.length - 2].price;
        const d = it.price - prev;
        if (Math.abs(d) > 0.004) {
          deltaHtml = '<div class="delta ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "↑" : "↓") + Math.abs(d).toFixed(1) + '</div>';
        }
      }
      const row = document.createElement("div");
      row.className = "item" + (idx === 0 ? " best" : "");
      row.innerHTML =
        '<span class="plat">' + esc(it.platform) + '</span>' +
        '<span class="price">¥' + it.price.toFixed(2) + '</span>' +
        (idx === 0 && arr.length > 1 ? '<span class="badge-low">最低</span>' : '') +
        deltaHtml +
        '<span class="ops">' +
          '<button title="更新价格" onclick="editItem(\'' + it.id + '\')">✏️</button>' +
          '<button title="删除" onclick="delItem(\'' + it.id + '\')">🗑</button>' +
        '</span>';
      box.appendChild(row);
      if (it.target) {
        const tl = document.createElement("div");
        const hit = it.price <= it.target;
        tl.className = "target-line" + (hit ? " hit" : "");
        tl.textContent = hit
          ? "🎯 已达目标价 ¥" + it.target.toFixed(2) + "，可以下手了"
          : "🎯 目标价 ¥" + it.target.toFixed(2) + "，还差 ¥" + (it.price - it.target).toFixed(2);
        box.appendChild(tl);
      }
    });
    list.appendChild(box);
  });
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function openAdd() {
  editingId = null;
  document.getElementById("sheetTitle").textContent = "添加商品";
  ["fName", "fPrice", "fTarget", "fNote", "fLink"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("fPlat").value = "淘宝";
  const prev = document.getElementById("ocrPreview");
  prev.style.display = "none"; prev.src = "";
  ocrStatus("");
  const dl = document.getElementById("nameList");
  dl.innerHTML = Object.keys(groups()).map(n => '<option value="' + esc(n) + '">').join("");
  document.getElementById("addMask").classList.add("show");
}
function closeAdd() { document.getElementById("addMask").classList.remove("show"); }

function editItem(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  editingId = id;
  document.getElementById("sheetTitle").textContent = "更新价格";
  document.getElementById("fName").value = it.name;
  document.getElementById("fPlat").value = it.platform;
  document.getElementById("fPrice").value = it.price;
  document.getElementById("fTarget").value = it.target || "";
  document.getElementById("fNote").value = it.note || "";
  document.getElementById("fLink").value = it.link || "";
  document.getElementById("addMask").classList.add("show");
}

function saveItem() {
  const name = document.getElementById("fName").value.trim();
  const platform = document.getElementById("fPlat").value;
  const price = parseFloat(document.getElementById("fPrice").value);
  const target = parseFloat(document.getElementById("fTarget").value) || null;
  const note = document.getElementById("fNote").value.trim();
  const link = document.getElementById("fLink").value.trim();

  if (!name) { toast("请填写商品名称"); return; }
  if (!(price > 0)) { toast("请填写正确的价格"); return; }

  if (editingId) {
    const it = items.find(x => x.id === editingId);
    if (it) {
      if (Math.abs(it.price - price) > 0.004) {
        it.history = it.history || [];
        it.history.push({ date: today(), price: price });
      }
      it.name = name; it.platform = platform; it.price = price;
      it.target = target; it.note = note; it.link = link;
    }
  } else {
    const dup = items.find(x => x.name === name && x.platform === platform);
    if (dup) {
      if (Math.abs(dup.price - price) > 0.004) {
        dup.history = dup.history || [];
        dup.history.push({ date: today(), price: price });
      }
      dup.price = price; dup.target = target || dup.target; dup.note = note || dup.note; dup.link = link || dup.link;
      toast("已更新该平台的记录");
    } else {
      items.push({ id: uid(), name, platform, price, target, note, link,
        history: [{ date: today(), price: price }], updated: today() });
    }
  }
  save(); render(); closeAdd(); checkTargets(true);
}

function delItem(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (!confirm("确定删除「" + it.name + " / " + it.platform + "」这条记录吗？")) return;
  items = items.filter(x => x.id !== id);
  save(); render(); toast("已删除");
}

function checkTargets(manual) {
  const hits = items.filter(it => it.target && it.price <= it.target);
  if (hits.length === 0) {
    if (manual) toast("暂无商品达到目标价");
    return;
  }
  document.getElementById("alertInfo").textContent = hits.map(it =>
    "· " + it.name + "（" + it.platform + "）现在 ¥" + it.price.toFixed(2) + "，你设的目标价是 ¥" + it.target.toFixed(2)
  ).join("\n");
  document.getElementById("alertMask").classList.add("show");
  if (navigator.vibrate) { try { navigator.vibrate([300, 150, 300]); } catch (e) {} }
}
function closeAlert() { document.getElementById("alertMask").classList.remove("show"); }

function exportData() {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "比价本备份_" + today() + ".json";
  a.click();
  toast("已导出备份文件");
}
function importData(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const arr = JSON.parse(e.target.result);
      if (!Array.isArray(arr)) throw 0;
      if (!confirm("将合并导入 " + arr.length + " 条记录，确定吗？")) return;
      arr.forEach(it => { if (!items.find(x => x.id === it.id)) items.push(it); });
      save(); render(); toast("导入成功");
    } catch (err) { toast("文件格式不正确"); }
    input.value = "";
  };
  r.readAsText(f);
}

/* ---------------- 拍照识别（OCR） ---------------- */
let tesseractLoading = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = resolve; s.onerror = () => reject(new Error("load error"));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error("timeout")), 20000);
  });
}

function ensureTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  const cdns = [
    "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js",
    "https://cdn.staticfile.net/tesseract.js/5.1.1/tesseract.min.js",
    "https://lib.baomitu.com/tesseract.js/5.1.1/tesseract.min.js"
  ];
  tesseractLoading = (async () => {
    for (const url of cdns) {
      try {
        await loadScript(url);
        if (window.Tesseract) return;
      } catch (e) { /* 换下一个源 */ }
    }
    throw new Error("引擎加载失败");
  })();
  return tesseractLoading;
}

function ocrStatus(msg) { document.getElementById("ocrStatus").textContent = msg || ""; }

// 裁掉截图顶部状态栏（时间/信号/电量）和底部横条，避免被误识别成商品信息
async function cropImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const w = img.width, h = img.height;
        const top = Math.round(h * 0.085);   // 裁掉顶部约 8.5%（状态栏）
        const bottom = Math.round(h * 0.05); // 裁掉底部约 5%
        const c = document.createElement("canvas");
        c.width = w; c.height = Math.max(50, h - top - bottom);
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, top, w, h - top - bottom, 0, 0, w, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => resolve(b || file), "image/png");
      } catch (e) { resolve(file); }
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}

async function doOCR(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const prev = document.getElementById("ocrPreview");
  prev.src = URL.createObjectURL(file);
  prev.style.display = "block";

  try {
    ocrStatus("正在加载文字识别引擎（首次约 10-30 秒）…");
    await ensureTesseract();
    ocrStatus("正在识别文字，请稍候…");
    const cropped = await cropImage(file);
    const res = await Tesseract.recognize(cropped, "chi_sim+eng", {
      logger: m => {
        if (m.status === "recognizing text") ocrStatus("识别中… " + Math.round((m.progress || 0) * 100) + "%");
        else if (m.status === "loading language traineddata") ocrStatus("正在下载中文识别包（首次较慢）…");
      }
    });
    const text = (res.data && res.data.text) || "";
    if (!text.trim()) { ocrStatus("没识别到文字，可换个清晰点的截图，或手动填写"); return; }
    const info = parseInfo(text);
    applyInfo(info);
    ocrStatus("识别完成，已自动填入下方表单，请核对后保存 ✅");
  } catch (e) {
    ocrStatus("识别引擎加载失败（可能网络受限）。可手动填写，或把截图发给我帮您识别。");
  } finally {
    input.value = "";
  }
}

function parseInfo(raw) {
  const lines = raw.split(/\n+/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  const text = lines.join(" ");

  // 1) 平台识别
  const platMap = [
    [/拼多多|拼夕夕|百亿补贴/, "拼多多"],
    [/天猫|tmall/i, "天猫"],
    [/淘宝|taobao/i, "淘宝"],
    [/京东|jd\.com|自营/i, "京东"],
    [/抖音|抖店|直播间/, "抖音"],
    [/唯品会/, "唯品会"],
    [/苏宁/, "苏宁"]
  ];
  let platform = "";
  for (const [re, name] of platMap) { if (re.test(text)) { platform = name; break; } }

  // 2) 价格识别：优先「到手价/券后/实付」，其次带 ¥/元 的价格，最后整行只有一个数字的（价格角标）
  let price = null;
  const near = text.match(/(到手价|券后|实付|实付款|应付款|优惠后)[^0-9¥￥]{0,6}[¥￥]?\s*(\d+(?:\.\d{1,2})?)/);
  if (near) price = parseFloat(near[2]);
  if (!price) {
    const all = [...text.matchAll(/[¥￥]\s*(\d+(?:\.\d{1,2})?)|(\d+(?:\.\d{1,2})?)\s*元/g)]
      .map(m => parseFloat(m[1] || m[2]))
      .filter(v => v > 0.5 && v < 100000);
    if (all.length) price = Math.min(...all);
  }
  if (!price) {
    const bare = lines
      .map(l => l.match(/^[¥￥]?\s*(\d+(?:\.\d{1,2})?)\s*$/))
      .filter(Boolean)
      .map(m => parseFloat(m[1]))
      .filter(v => v >= 10 && v < 100000);
    if (bare.length) price = Math.min(...bare);
  }

  // 3) 商品名称：只挑含中文的行，过滤状态栏杂讯（时间/信号/电量/按钮文案）
  const junk = /^\d{1,2}[:：]\d{2}(\s|$)/;               // 19:25 这样的时间
  const net = /\b(4g|5g|wifi|lte|volte)\b/i;             // 网络标识
  const stop = /^(加入购物车|立即购买|领券|优惠券|分享|收藏|客服|店铺|评价|详情|参数|首页|购物车|我的|搜索|确认|提交订单|马上抢|去购买)/;
  const cand = lines
    .filter(l => (l.match(/[\u4e00-\u9fff]/g) || []).length >= 4)   // 至少 4 个汉字
    .filter(l => !junk.test(l))
    .filter(l => !stop.test(l))
    .filter(l => !/^(已售|月销|销量|好评|包邮|现货|预售)/.test(l))
    .filter(l => (l.replace(/[^\u4e00-\u9fff a-zA-Z0-9.·]/g, "").length / l.length) > 0.5); // 中文+字母数字占比过半
  // 取中文字符最多的一行（商品标题通常最长），相同则取靠前的
  let name = "";
  let bestScore = 0;
  cand.forEach((l, i) => {
    const cjk = (l.match(/[\u4e00-\u9fff]/g) || []).length;
    const score = cjk + (/（|\(|无|款|型|代|装|充|板|器|机|车|衣|鞋|套|杯|锅|床|品/.test(l) ? 2 : 0) - i * 0.3;
    if (score > bestScore) { bestScore = score; name = l; }
  });
  if (name) name = name.replace(/\s*(4g|5g|wifi)\s*$/i, "").trim().slice(0, 60);

  // 4) 规格备注：抓常见规格词（严格区分大小写，避免把 4G 当成规格）
  const spec = text.match(/(\d+\s*(mAh|GB|TB|寸|英寸|片|粒|袋|瓶|包|颗|ml|kg|L)(?![a-zA-Z])|(\d+)\s*天灵)/) || text.match(/\d+\s*(mAh|GB|TB|寸|英寸|kg|ml)/);
  return { name, price, platform, spec: spec ? spec[0].trim() : "" };
}

function applyInfo(info) {
  if (info.name) document.getElementById("fName").value = info.name.slice(0, 60);
  if (info.price) document.getElementById("fPrice").value = info.price;
  if (info.platform) document.getElementById("fPlat").value = info.platform;
  if (info.spec) document.getElementById("fNote").value = info.spec;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

render();
setTimeout(() => checkTargets(false), 800);
</script>
</body>
